<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>Discord Proxy Printer</title>
<style>
:root{--bg:#f4f1ea;--panel:#fff;--ink:#171717;--muted:#6d6962;--line:#d9d2c6;--soft:#ece7de;--accent:#1d1d1f;--good:#2f6a45;--bad:#a33838}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif}
.app{max-width:900px;margin:0 auto;padding:18px 14px 40px}
.header{padding:10px 2px 16px}
h1{font-size:25px;line-height:1.15;margin:0 0 7px;letter-spacing:-.02em}
.sub{font-size:14px;line-height:1.55;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.045);margin-bottom:14px}
.search{display:flex;gap:8px}
input{min-width:0;flex:1;border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:12px 13px;font-size:16px;outline:none}
button{appearance:none;border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;background:var(--accent);color:white;cursor:pointer}
button.secondary{background:var(--soft);color:var(--ink)}
button.outline{background:white;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.status{font-size:13px;color:var(--muted);min-height:20px;margin-top:9px}
.status.good{color:var(--good)} .status.bad{color:var(--bad)}
.proxy-wrap{display:flex;justify-content:center}
.proxy{width:min(100%,354px);aspect-ratio:63/88;background:white;border:2px solid #111;border-radius:13px;padding:14px;display:flex;flex-direction:column;overflow:hidden}
.proxy-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-bottom:2px solid #111;padding-bottom:7px}
.name{font-size:21px;line-height:1.12;font-weight:850;letter-spacing:-.02em}
.mana{font-size:14px;font-weight:800;white-space:nowrap}
.type{font-size:13px;font-weight:750;border-bottom:1px solid #333;padding:7px 0}
.oracle{font-family:Georgia,"Times New Roman",serif;font-size:14px;line-height:1.35;white-space:pre-wrap;padding-top:9px;flex:1;overflow:hidden}
.face+.face{border-top:2px dashed #777;margin-top:10px;padding-top:10px}
.pt{align-self:flex-end;border:1.5px solid #111;border-radius:7px;padding:3px 7px;font-size:15px;font-weight:850;margin-top:6px}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;color:#666;font-size:10px}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:10px}
.recent{display:flex;gap:7px;overflow:auto;padding-bottom:2px}
.recent button{font-size:12px;padding:8px 10px;white-space:nowrap}
.footer{font-size:12px;line-height:1.55;color:var(--muted);padding:4px}
@media(min-width:760px){.app{padding:28px}.layout{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}.controls{position:sticky;top:18px}}
@media print{
 @page{size:80mm auto;margin:4mm}
 body{background:#fff}.header,.controls,.footer,.note,.meta{display:none!important}
 .app,.layout,.card{padding:0!important;margin:0!important;display:block!important;border:0!important;box-shadow:none!important}
 .proxy-wrap{display:block}.proxy{width:63mm;height:88mm;aspect-ratio:auto;border:0;border-radius:0;padding:4mm;page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
 <div class="header">
  <h1>Discord Proxy Printer</h1>
  <div class="sub">iPhone 友好的 Scryfall → 文字代理卡原型。随机非地牌、按名字查牌，然后打印或保存成 PNG。</div>
 </div>
 <div class="layout">
  <div class="controls">
   <div class="card">
    <div class="search">
     <input id="q" placeholder="输入卡名，例如 Sol Ring" autocapitalize="off" autocomplete="off">
     <button id="searchBtn">查找</button>
    </div>
    <div class="actions">
     <button id="randomBtn">🎲 随机非地牌</button>
     <button id="printBtn" class="secondary">🖨 打印</button>
     <button id="pngBtn" class="outline">🖼 保存 PNG</button>
     <button id="copyBtn" class="outline">📋 复制文字</button>
    </div>
    <div id="status" class="status">当前为示例卡。联网后可直接调用 Scryfall。</div>
   </div>
   <div class="card">
    <div style="font-weight:800;font-size:14px;margin-bottom:9px">最近查看</div>
    <div class="recent" id="recent"></div>
    <div class="note">iPhone 上建议把网页“添加到主屏幕”。以后接 Phomemo 时，最稳妥的路线通常是“生成 PNG → 分享到打印 App”。</div>
   </div>
  </div>
  <div class="card proxy-card">
   <div class="proxy-wrap"><div class="proxy" id="proxy"></div></div>
   <div class="note">代理卡刻意不放原卡图，优先保证热敏纸上的 Oracle text 可读。双面牌会显示两个 face。</div>
  </div>
 </div>
 <div class="footer">卡牌数据来自 Scryfall API。最近查看仅保存在本机浏览器 localStorage。</div>
</div>

<script>
const $=s=>document.querySelector(s), api="https://api.scryfall.com";
let current={
 name:"Discord, Lord of Disharmony",mana_cost:"{2}{B}{R}",
 type_line:"Legendary Creature — Chimera",
 oracle_text:"At the beginning of your end step, exile cards from the top of your library until you exile a nonland card. You may cast that card without paying its mana cost. If you do, copy this ability.",
 power:"4",toughness:"4",set_name:"Secret Lair Drop",set:"sld",collector_number:"798"
};
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function faceHtml(f){
 const pt=(f.power!==undefined&&f.toughness!==undefined)?`${esc(f.power)}/${esc(f.toughness)}`:(f.loyalty?`Loyalty ${esc(f.loyalty)}`:"");
 return `<div class="face"><div class="proxy-head"><div class="name">${esc(f.name||current.name)}</div><div class="mana">${esc(f.mana_cost||"")}</div></div><div class="type">${esc(f.type_line||"")}</div><div class="oracle">${esc(f.oracle_text||"").replace(/\n/g,"<br>")}</div>${pt?`<div class="pt">${pt}</div>`:""}</div>`;
}
function render(card){
 current=card; const faces=card.card_faces?.length?card.card_faces:[card];
 $("#proxy").innerHTML=faces.map(faceHtml).join("")+`<div class="meta"><span>${esc(card.set_name||"")}</span><span>${esc((card.set||"").toUpperCase())} ${esc(card.collector_number||"")}</span></div>`;
 remember(card.name);
}
function setStatus(t,k=""){const e=$("#status");e.textContent=t;e.className="status "+k}
function loading(v){$("#randomBtn").disabled=v;$("#searchBtn").disabled=v}
async function fetchJson(url){const r=await fetch(url,{headers:{"Accept":"application/json"}});if(!r.ok)throw new Error(`Scryfall ${r.status}`);return r.json()}
async function randomCard(){
 try{loading(true);setStatus("正在随机非地牌…");const c=await fetchJson(`${api}/cards/random?q=${encodeURIComponent("-t:land")}`);render(c);setStatus("已随机。若是瞬间/法术，可以不打印。","good")}
 catch(e){setStatus("请求失败："+e.message+"。若你是在 iPhone“文件”里预览，请改用 Safari 访问托管网页。","bad")} finally{loading(false)}
}
async function searchCard(){
 const q=$("#q").value.trim();if(!q)return;
 try{loading(true);setStatus("正在查找…");const c=await fetchJson(`${api}/cards/named?fuzzy=${encodeURIComponent(q)}`);render(c);setStatus("已找到："+c.name,"good")}
 catch(e){setStatus("没有找到或网络请求失败："+e.message,"bad")} finally{loading(false)}
}
function plainText(card=current){
 const faces=card.card_faces?.length?card.card_faces:[card];
 return faces.map(f=>{const pt=(f.power!==undefined&&f.toughness!==undefined)?`\n${f.power}/${f.toughness}`:(f.loyalty?`\nLoyalty ${f.loyalty}`:"");return `${f.name||card.name} ${f.mana_cost||""}\n${f.type_line||""}\n\n${f.oracle_text||""}${pt}`}).join("\n\n——— FLIP ———\n\n");
}
async function copyText(){try{await navigator.clipboard.writeText(plainText());setStatus("已复制代理卡文字。","good")}catch(e){setStatus("复制失败；可长按页面文字手动复制。","bad")}}
function wrap(ctx,text,x,y,maxWidth,lineHeight,maxLines=30){
 let line="",lines=[];for(const p of String(text||"").split("\n")){if(!p){lines.push("");continue}for(const ch of [...p]){const t=line+ch;if(ctx.measureText(t).width>maxWidth&&line){lines.push(line);line=ch}else line=t}if(line){lines.push(line);line=""}}
 for(const l of lines.slice(0,maxLines)){ctx.fillText(l,x,y);y+=lineHeight}return y
}
function proxyPng(){
 const scale=4,W=630,H=880,c=document.createElement("canvas");c.width=W*scale;c.height=H*scale;const ctx=c.getContext("2d");ctx.scale(scale,scale);
 ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#111";ctx.lineWidth=4;ctx.strokeRect(8,8,W-16,H-16);
 let y=45,pad=34,width=W-pad*2;const faces=current.card_faces?.length?current.card_faces:[current];
 faces.forEach((f,i)=>{
  if(i){ctx.setLineDash([12,8]);ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();ctx.setLineDash([]);y+=24}
  ctx.fillStyle="#111";ctx.font="bold 30px Arial";y=wrap(ctx,f.name||current.name,pad,y,width-150,34,2)+4;
  ctx.font="bold 20px Arial";ctx.textAlign="right";ctx.fillText(f.mana_cost||"",W-pad,45);ctx.textAlign="left";
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();y+=28;
  ctx.font="bold 19px Arial";y=wrap(ctx,f.type_line||"",pad,y,width,24,3)+12;
  ctx.font="22px Georgia";y=wrap(ctx,f.oracle_text||"",pad,y,width,29,17)+10;
  if(f.power!==undefined&&f.toughness!==undefined){ctx.font="bold 25px Arial";ctx.textAlign="right";ctx.fillText(`${f.power}/${f.toughness}`,W-pad,H-40);ctx.textAlign="left"}
  else if(f.loyalty){ctx.font="bold 22px Arial";ctx.textAlign="right";ctx.fillText(`Loyalty ${f.loyalty}`,W-pad,H-40);ctx.textAlign="left"}
 });
 c.toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=(current.name||"proxy").replace(/[^\w\-]+/g,"_")+".png";a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);setStatus("已生成 PNG。iPhone 上可从下载项打开并分享到打印 App。","good")},"image/png");
}
function remember(name){if(!name)return;let a=JSON.parse(localStorage.getItem("discordProxyRecent")||"[]");a=[name,...a.filter(x=>x!==name)].slice(0,6);localStorage.setItem("discordProxyRecent",JSON.stringify(a));renderRecent()}
function renderRecent(){const a=JSON.parse(localStorage.getItem("discordProxyRecent")||"[]");$("#recent").innerHTML=a.length?a.map(n=>`<button class="secondary" data-n="${esc(n)}">${esc(n)}</button>`).join(""):"<span style='font-size:12px;color:#888'>暂无</span>";document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{$("#q").value=b.dataset.n;searchCard()})}
$("#randomBtn").onclick=randomCard;$("#searchBtn").onclick=searchCard;$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")searchCard()});$("#printBtn").onclick=()=>window.print();$("#pngBtn").onclick=proxyPng;$("#copyBtn").onclick=copyText;
render(current);renderRecent();
</script>
</body>
</html>
