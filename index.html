<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>Discord Proxy Printer v12 · 58mm 大字双行标题版</title>
<style>
:root{--bg:#f4f1ea;--panel:#fff;--ink:#171717;--muted:#6d6962;--line:#d9d2c6;--soft:#ece7de;--accent:#1d1d1f;--good:#2f6a45;--bad:#a33838;--preview-width:340px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif}
.app{max-width:980px;margin:0 auto;padding:10px 12px 32px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.045);margin-bottom:14px}
.search{display:flex;gap:8px;align-items:stretch}.search button{flex:0 0 auto;white-space:nowrap}.primary-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
input{min-width:0;flex:1;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 13px;font-size:16px;outline:none} input:focus{border-color:#888;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
button{appearance:none;border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer} button.secondary{background:var(--soft);color:var(--ink)} button.outline{background:#fff;color:var(--ink);border:1px solid var(--line)} button:disabled{opacity:.45}
.more-card summary{cursor:pointer;font-weight:800;font-size:14px;list-style:none}.more-card summary::-webkit-details-marker{display:none}.more-card[open] summary{margin-bottom:12px}.more-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.status{font-size:13px;color:var(--muted);min-height:20px;margin-top:9px;line-height:1.45}.status.good{color:var(--good)}.status.bad{color:var(--bad)}
.art-preview{display:none;margin:0 auto 14px}.art-preview.visible{display:block}.art-preview-grid{display:flex;justify-content:center;align-items:flex-start;gap:8px;flex-wrap:wrap;margin:0 auto}.art-preview img{display:block;width:min(100%,var(--preview-width));max-width:100%;height:auto;border-radius:13px;box-shadow:0 4px 14px rgba(0,0,0,.11);background:#eee}
.proxy-preview-wrap{display:flex;justify-content:center}.proxy-preview{display:block;width:min(100%,var(--preview-width));max-width:100%;height:auto;border-radius:13px;box-shadow:0 4px 14px rgba(0,0,0,.12);background:#fff}
.section-title{font-weight:800;font-size:14px;margin-bottom:9px}
.chips{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.chips.wrap{flex-wrap:wrap;overflow:visible}.chips button{font-size:12px;padding:8px 10px;white-space:nowrap}
.result-list{display:grid;gap:7px}.result-btn{width:100%;text-align:left;background:var(--soft);color:var(--ink);padding:10px 11px;display:flex;justify-content:space-between;align-items:center;gap:10px}.result-main{min-width:0}.result-name{font-weight:800;font-size:13px}.result-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:normal}.result-stat{font-size:12px;font-weight:850;white-space:nowrap}
.hidden{display:none!important}.footer{font-size:12px;line-height:1.55;color:var(--muted);padding:4px}
@media(min-width:760px){.app{padding:28px}.layout{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}.controls{position:sticky;top:18px}}
</style>
</head>
<body>
<div class="app">
  <div class="layout">
    <div class="controls">
      <div class="card">

        <div class="search">
          <input id="tokenQ" placeholder="搜索 Token，例如 Dragon" autocapitalize="off" autocomplete="off" enterkeyhint="search">
          <button id="tokenSearchBtn" class="secondary">查找 Token</button>
        </div>
        <div class="primary-actions">
          <button id="randomBtn">🎲 随机非地牌</button>
          <button id="printBtn" class="outline">🖨 打印</button>
        </div>
        <div id="status" class="status">“Oh, what fun is there in making sense?”</div>
      </div>
      <div id="tokenResultsCard" class="card hidden"><div class="section-title">Token 搜索结果</div><div id="tokenResults" class="result-list"></div></div>
      <div id="relatedTokensCard" class="card hidden"><div class="section-title">这张牌的相关 Token</div><div id="relatedTokens" class="chips wrap"></div></div>
    </div>

<script>
const $ = s => document.querySelector(s);
const api = "https://api.scryfall.com";
const PREVIEW_WIDTH = 384;
const BOTTOM_SAFE_MARGIN = 24;
const STORAGE_KEY = "discordProxyRecentV12";
let lastPreviewBlob = null;
let lastPreviewUrl = "";
let current = {name:"Discord, Lord of Disharmony", mana_cost:"{2}{B}{R}", type_line:"Legendary Creature — Chimera", oracle_text:"At the beginning of your end step, exile cards from the top of your library until you exile a nonland card. You may cast that card without paying its mana cost. If you do, copy this ability.", power:"4", toughness:"4", rarity:"rare", set_name:"Secret Lair Drop", set:"sld", collector_number:"798", layout:"normal"};
const rarityMap = {common:"C", uncommon:"U", rare:"R", mythic:"M", special:"S", bonus:"B"};
const esc = s => String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function rarityLabel(c){ return rarityMap[String(c.rarity||"").toLowerCase()] || String(c.rarity || "?").slice(0,1).toUpperCase(); }
function statText(f){ if(f.power !== undefined && f.toughness !== undefined) return `${f.power}/${f.toughness}`; if(f.loyalty) return `L ${f.loyalty}`; if(f.defense) return `D ${f.defense}`; return ""; }
function isPlaneswalkerFace(f){ return /Planeswalker/i.test(f.type_line || "") || !!f.loyalty; }
function isBattleFace(f){ return /Battle/i.test(f.type_line || "") || !!f.defense; }
function isSagaLike(f){ return /Saga|Class/i.test(f.type_line || ""); }
function cardImageEntries(card){ const imageUrl = x => x?.image_uris?.large || x?.image_uris?.normal || x?.image_uris?.png || x?.image_uris?.small || ""; if(imageUrl(card)) return [{name:card.name||"Card", url:imageUrl(card)}]; if(card?.card_faces?.length) return card.card_faces.filter(f=>imageUrl(f)).map(f=>({name:f.name||card.name||"Card face", url:imageUrl(f)})); return []; }
function renderCardArt(card){ const box=$("#artPreview"), grid=$("#artPreviewGrid"), images=cardImageEntries(card); grid.innerHTML=""; if(!images.length){ box.classList.remove("visible"); return; } images.forEach(item=>{ const img=document.createElement("img"); img.src=item.url; img.alt=`${item.name} 卡图`; img.loading="eager"; img.fetchPriority="high"; grid.appendChild(img); }); box.classList.add("visible"); }
function setStatus(t, kind=""){ const el=$("#status"); el.textContent=t; el.className="status "+kind; }
function loading(v){ ["randomBtn","randomTokenBtn","searchBtn","tokenSearchBtn","printBtn","pngBtn","openImgBtn"].forEach(id=>{ const el=$("#"+id); if(el) el.disabled=v; }); }
async function fetchJson(url){ const r = await fetch(url,{headers:{"Accept":"application/json;q=0.9,*/*;q=0.8"}}); if(!r.ok){ let detail=""; try{ const j=await r.json(); detail=j.details?` · ${j.details}`:""; }catch(_){} throw new Error(`Scryfall ${r.status}${detail}`); } return r.json(); }
function tokenSignature(c){ const faces = c.card_faces?.length ? c.card_faces : [c]; return faces.map(f=>[f.name||c.name,f.type_line||"",f.oracle_text||"",f.power??"",f.toughness??"",f.loyalty??"",f.defense??""].join("|")).join("||"); }
function tokenResultLabel(c){ const f=c.card_faces?.[0]||c; return {name:c.name, sub:[f.type_line||"",(f.oracle_text||"").replace(/\n/g," · ")].filter(Boolean).join(" — "), stat:statText(f)}; }
function hideTokenResults(){ $("#tokenResultsCard").classList.add("hidden"); $("#tokenResults").innerHTML=""; }
function renderTokenResults(cards){ const root=$("#tokenResults"); root.innerHTML=""; cards.forEach(c=>{ const info=tokenResultLabel(c); const b=document.createElement("button"); b.className="result-btn"; b.innerHTML=`<span class="result-main"><span class="result-name">${esc(info.name)}</span><span class="result-sub">${esc(info.sub||"Token")}</span></span><span class="result-stat">${esc(info.stat)}</span>`; b.onclick=async()=>{ await render(c); hideTokenResults(); setStatus("已找到："+c.name,"good"); }; root.appendChild(b); }); $("#tokenResultsCard").classList.remove("hidden"); }
async function searchToken(){ const raw=$("#tokenQ").value.trim(); if(!raw) return; try{ loading(true); setStatus("正在寻找 Token…"); const safe=raw.replace(/"/g,'\\"'); const query=`include:extras t:token name:"${safe}"`; const data=await fetchJson(`${api}/cards/search?q=${encodeURIComponent(query)}&unique=prints&order=name`); const seen=new Set(), unique=[]; for(const c of data.data||[]){ const sig=tokenSignature(c); if(!seen.has(sig)){ seen.add(sig); unique.push(c); } if(unique.length>=12) break; } if(!unique.length) throw new Error("没有匹配的 Token"); if(unique.length===1){ hideTokenResults(); await render(unique[0]); setStatus("已找到："+unique[0].name,"good"); } else { renderTokenResults(unique); setStatus(`找到 ${unique.length} 种不同规则版本，请选择。`,"good"); } }catch(e){ hideTokenResults(); setStatus("获取失败："+e.message,"bad"); }finally{ loading(false); } }
async function searchCard(){ const q=$("#cardQ").value.trim(); if(!q) return; try{ loading(true); hideTokenResults(); setStatus("正在寻找卡牌…"); const c=await fetchJson(`${api}/cards/named?fuzzy=${encodeURIComponent(q)}`); await render(c); setStatus("已找到："+c.name,"good"); }catch(e){ setStatus("获取失败："+e.message,"bad"); }finally{ loading(false); } }
async function randomCard(){ try{ loading(true); hideTokenResults(); setStatus("正在召唤混乱…"); const c=await fetchJson(`${api}/cards/random?q=${encodeURIComponent("-t:land -t:token")}`); await render(c); setStatus("命运选择了："+c.name,"good"); }catch(e){ setStatus("获取失败："+e.message,"bad"); }finally{ loading(false); } }
async function randomToken(){ try{ loading(true); hideTokenResults(); setStatus("正在召唤混乱…"); const c=await fetchJson(`${api}/cards/random?q=${encodeURIComponent("include:extras t:token")}`); await render(c); setStatus("命运选择了："+c.name,"good"); }catch(e){ setStatus("获取失败："+e.message,"bad"); }finally{ loading(false); } }
async function renderRelatedTokens(card){ const parts=(card.all_parts||[]).filter(p=>p.component==="token"&&p.uri); const wrap=$("#relatedTokens"); wrap.innerHTML=""; if(!parts.length){ $("#relatedTokensCard").classList.add("hidden"); return; } $("#relatedTokensCard").classList.remove("hidden"); for(const p of parts){ const b=document.createElement("button"); b.className="secondary"; b.textContent=p.name||"Token"; b.onclick=async()=>{ try{ setStatus("正在寻找 Token…"); const token=await fetchJson(p.uri); await render(token); setStatus("已找到："+token.name,"good"); }catch(e){ setStatus("获取失败："+e.message,"bad"); } }; wrap.appendChild(b); } }
function getRecent(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }catch(_){ return []; } }
function saveRecent(arr){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }catch(_){} }
function remember(card){ if(!card?.name) return; let arr=getRecent(); const item={name:card.name, uri:card.uri||"", token:(card.layout==="token"||(card.type_line||"").includes("Token"))}; arr=[item,...arr.filter(x=>x.uri?x.uri!==item.uri:x.name!==item.name)].slice(0,8); saveRecent(arr); renderRecent(); }
function renderRecent(){ const arr=getRecent(); const root=$("#recent"); if(!arr.length){ root.innerHTML="<span style='font-size:12px;color:#888'>暂无</span>"; return; } root.innerHTML=""; arr.forEach(item=>{ const b=document.createElement("button"); b.className="secondary"; b.textContent=(item.token?"Token · ":"")+item.name; b.onclick=async()=>{ try{ setStatus("正在寻找卡牌…"); if(item.uri){ const c=await fetchJson(item.uri); await render(c); setStatus("已找到："+c.name,"good"); } else { $("#morePanel").open=true; $("#cardQ").value=item.name; await searchCard(); } }catch(e){ setStatus("获取失败："+e.message,"bad"); } }; root.appendChild(b); }); }
function inferKind(card){ const layout=String(card.layout||"normal"); const faces=card.card_faces?.length?card.card_faces:[card]; const first=faces[0]||card; if(isBattleFace(first)) return "battle"; if(layout==="split") return "split"; if(layout==="flip") return "flip"; if(layout==="adventure") return "adventure"; if(["transform","modal_dfc","double_faced_token","reversible_card","meld"].includes(layout)&&faces.length>1) return "double"; return "normal"; }
// Every number below is in native printer pixels: 384 px = 48 mm on 203 dpi.
const SIZES = {
  name:28, mana:22, type:19, meta:15,
  body:26, bodyLong:24, bodyVeryLong:22,
  bodyLine:34, bodyLongLine:32, bodyVeryLongLine:30,
  stat:26
};
function setFont(ctx,size,weight=700,family='Arial'){
  ctx.font=`${weight} ${size}px ${family}`;
}
function drawDivider(ctx,x1,y,x2){
  ctx.strokeStyle='#151515'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke();
}
function wrapParagraph(ctx, paragraph, maxWidth){
  if(!paragraph) return [''];
  const out=[];
  let line='';
  // Preserve punctuation and spaces well enough for oracle text. Fall back to
  // code-point wrapping only for an individual oversized token.
  for(const token of paragraph.match(/\S+\s*/gu)||[]){
    const word=token.trimEnd();
    const candidate=line ? `${line} ${word}` : word;
    if(ctx.measureText(candidate).width <= maxWidth){ line=candidate; continue; }
    if(line){ out.push(line); line=''; }
    if(ctx.measureText(word).width <= maxWidth){ line=word; continue; }
    for(const ch of Array.from(word)){
      if(line && ctx.measureText(line+ch).width > maxWidth){ out.push(line); line=ch; }
      else line+=ch;
    }
  }
  if(line || !out.length) out.push(line);
  return out;
}
function bodyLines(ctx, text, width){
  const result=[];
  const paras=String(text||'').split('\n');
  paras.forEach((para,pi)=>{
    const lines=wrapParagraph(ctx,para,width);
    lines.forEach((line,li)=>result.push({text:line, extra:(pi>0 && li===0 ? 5 : 0)}));
  });
  return result;
}
// Always reserve two name rows. Row 1 gets all of the width; mana sits at the
// far right of row 2. For unusually long names, try smaller name text BEFORE
// allowing it to overlap the mana cost.
function titleLayout(ctx,face,inner){
  const text=String(face.name||current.name||'Unknown card').trim();
  const mana=String(face.mana_cost||'');
  let manaSize=SIZES.mana;
  setFont(ctx,manaSize,800);
  while(manaSize>16 && ctx.measureText(mana).width > inner*.58){
    manaSize--; setFont(ctx,manaSize,800);
  }
  const manaWidth=mana ? Math.ceil(ctx.measureText(mana).width)+12 : 0;
  const row2Width=Math.max(65,inner-manaWidth);
  for(let sz=SIZES.name;sz>=18;sz--){
    setFont(ctx,sz,800);
    if(ctx.measureText(text).width<=inner)
      return {size:sz, manaSize, rows:[text,''], manaWidth};
    const pieces=Array.from(text);
    // Longest first row that fits; ensure the rest also fits in the shorter
    // second row. Prefer word boundaries when available.
    let split=null;
    for(let i=pieces.length-1;i>0;i--){
      const a=pieces.slice(0,i).join('').trimEnd();
      const b=pieces.slice(i).join('').trimStart();
      if(!a||!b) continue;
      if(ctx.measureText(a).width<=inner && ctx.measureText(b).width<=row2Width){
        if(!split || /[\s—–,:]/u.test(pieces[i-1])){ split=[a,b]; if(/[\s—–,:]/u.test(pieces[i-1])) break; }
      }
    }
    if(split) return {size:sz,manaSize,rows:split,manaWidth};
  }
  // Two rows are reserved for all cards. Only exceptionally long titles
  // get additional rows: the SECOND row still reserves the mana area.
  setFont(ctx,18,800);
  function takeRow(remaining,maxWidth){
    const glyphs=Array.from(remaining);
    let n=0;
    for(let i=1;i<=glyphs.length;i++){
      if(ctx.measureText(glyphs.slice(0,i).join('')).width>maxWidth) break;
      n=i;
    }
    if(!n) n=1;
    const partial=glyphs.slice(0,n).join('');
    const lastGap=partial.search(/\s+[^\s]*$/u);
    if(lastGap>0 && n<glyphs.length) n=Array.from(partial.slice(0,lastGap)).length;
    return [glyphs.slice(0,n).join('').trim(), glyphs.slice(n).join('').trim()];
  }
  const rows=[];
  let remaining=text;
  let index=0;
  while(remaining && index<32){
    const width=index===1?row2Width:inner;
    const [line, rest]=takeRow(remaining,width);
    rows.push(line);
    remaining=rest;
    index++;
  }
  return {size:18,manaSize,rows,manaWidth,exceptional:true};
}
function makePanelLayout(ctx, face, width, options={}){
  const pad=13, inner=width-2*pad;
  const title=titleLayout(ctx,face,inner);
  const nameRowHeight=title.size+7;
  const headerHeight=13 + Math.max(2,title.rows.length)*nameRowHeight + 15;
  setFont(ctx,SIZES.type,700);
  const typeLines=wrapParagraph(ctx,face.type_line||'',inner);
  const typeHeight=10+typeLines.length*25+14;
  const textLen=(face.oracle_text||'').length;
  const size=textLen>700?SIZES.bodyVeryLong:textLen>350?SIZES.bodyLong:SIZES.body;
  const lineHeight=size===26?SIZES.bodyLine:size===24?SIZES.bodyLongLine:SIZES.bodyVeryLongLine;
  setFont(ctx,size,600,'Arial');
  const rules=bodyLines(ctx,face.oracle_text||'',inner);
  const bodyHeight=rules.reduce((n,line)=>n+lineHeight+line.extra,0);
  const emptyBody=!(face.oracle_text||'').trim();
  const ruleHeight=emptyBody ? 0 : bodyHeight;
  const footerHeight=51;
  const natural=headerHeight+typeHeight+ruleHeight+footerHeight+20;
  return {pad,inner,title,nameRowHeight,headerHeight,typeLines,typeHeight,size,lineHeight,rules,ruleHeight,footerHeight,natural};
}
function drawStat(ctx,face,right,baseY){
  const text=statText(face);
  if(!text) return;
  setFont(ctx,SIZES.stat,800);
  const w=Math.ceil(ctx.measureText(text).width)+16, h=36;
  const left=right-w;
  ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.strokeRect(left,baseY-h+7,w,h);
  ctx.fillStyle='#111';ctx.fillText(text,left+8,baseY+1);
}
function paintPanel(ctx,face,x,y,width,height,options={}){
  const d=makePanelLayout(ctx,face,width,options);
  if(height+0.001 < d.natural) throw new Error(`Panel height too small: ${height} < ${d.natural} (${face.name})`);
  ctx.save();
  if(options.rotate180){
    ctx.translate(x+width/2,y+height/2);ctx.rotate(Math.PI);
    ctx.translate(-(x+width/2),-(y+height/2));
  }
  ctx.fillStyle='#fff'; ctx.strokeStyle='#111';ctx.lineWidth=2;
  ctx.fillRect(x,y,width,height);ctx.strokeRect(x,y,width,height);ctx.fillStyle='#111';
  const left=x+d.pad,right=x+width-d.pad;
  let yy=y+13;
  setFont(ctx,d.title.size,800);
  // Fixed two rows, even if the name occupies only one of them.
  d.title.rows.forEach((row,idx)=>{
    ctx.fillText(row,left,yy+d.title.size);
    yy+=d.nameRowHeight;
  });
  while(d.title.rows.length===1 && yy<y+13+2*d.nameRowHeight) yy+=d.nameRowHeight;
  if(d.title.rows.length===2 && !d.title.rows[1]) {/* empty second row still reserved */}
  setFont(ctx,d.title.manaSize,800);ctx.textAlign='right';
  const secondRowBaseline=y+13+d.nameRowHeight+d.title.size;
  ctx.fillText(face.mana_cost||'',right,secondRowBaseline);
  ctx.textAlign='left';
  yy=y+d.headerHeight-10;
  drawDivider(ctx,left,yy,right);
  yy+=10;
  setFont(ctx,SIZES.type,700);
  d.typeLines.forEach(line=>{ctx.fillText(line,left,yy+SIZES.type);yy+=25;});
  drawDivider(ctx,left,yy+5,right);yy+=14;
  setFont(ctx,d.size,600,'Arial');
  for(const line of d.rules){
    yy+=line.extra;
    ctx.fillText(line.text,left,yy+d.size);
    yy+=d.lineHeight;
  }
  const footerBaseline=y+height-14;
  // Natural height reserves > 50 pixels after last rules baseline.
  if(yy>footerBaseline-43) throw new Error(`Body overlaps footer: ${face.name}`);
  drawDivider(ctx,left,footerBaseline-29,right);
  setFont(ctx,SIZES.meta,800);
  const metadata=`${(current.set||'').toUpperCase()} ${current.collector_number||''} · ${rarityLabel(current)}`.trim();
  const stat=statText(face);
  let meta=metadata;
  const available=right-left-(stat?Math.ceil(ctx.measureText(stat).width)+36:0);
  while(meta.length>3 && ctx.measureText(meta).width>available) meta=meta.slice(0,-2)+'…';
  ctx.fillText(meta,left,footerBaseline);
  drawStat(ctx,face,right,footerBaseline);
  ctx.restore();
}
function layoutPrint(card){
  const kind=inferKind(card);
  const faces=card.card_faces?.length?card.card_faces:[card];
  const probe=document.createElement('canvas').getContext('2d');
  const W=PREVIEW_WIDTH;
  const pw=W-16;
  const minNormal=(card.layout==='token'||/\bToken\b/i.test(faces[0]?.type_line||''))?410:524;
  if(kind==='battle'){
    // A battle is rendered sideways on 48mm paper: physical image is still
    // exactly 384 pixels wide, with text rotated 90 degrees inside it.
    let landscapeW=600;
    while(landscapeW<7000 && makePanelLayout(probe,faces[0],landscapeW-16,{kind}).natural>368)
      landscapeW+=64;
    const required=makePanelLayout(probe,faces[0],landscapeW-16,{kind}).natural;
    if(required>368) throw new Error('Battle text cannot fit sideways at 384 dots');
    const hasBack=faces.length>1;
    const backH=hasBack?Math.max(320,makePanelLayout(probe,faces[1],pw).natural):0;
    return {kind,faces,width:W,height:landscapeW+(hasBack?backH+40:0),landscapeW,backH};
  }
  if(kind==='normal'){
    const panel=Math.max(minNormal,makePanelLayout(probe,faces[0],pw).natural);
    return {kind,faces,width:W,height:panel+16,panels:[panel]};
  }
  const sizes=faces.slice(0,2).map((f,i)=>{
    const narrower=(kind==='adventure' && i===1);
    return Math.max(narrower?260:320,makePanelLayout(probe,f,narrower?W-48:pw).natural);
  });
  if(sizes.length===1) sizes.push(sizes[0]);
  const gap=(kind==='adventure')?34:24;
  return {kind,faces,width:W,height:sizes[0]+sizes[1]+gap+16,panels:sizes,gap};
}
function buildPrintCanvas(card){
  const plan=layoutPrint(card);
  const {kind,faces,width:W,height:H}=plan;
  const canvasH=H + BOTTOM_SAFE_MARGIN;
  const c=document.createElement('canvas');c.width=W;c.height=canvasH;
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,canvasH);
  if(kind==='battle'){
    // Rotate text, not the PNG dimensions: always output 384 px wide.
    ctx.save();ctx.translate(W,0);ctx.rotate(Math.PI/2);
    paintPanel(ctx,faces[0],8,8,plan.landscapeW-16,W-16);ctx.restore();
    if(plan.backH){
      const by=plan.landscapeW+32;
      setFont(ctx,13,800);ctx.fillStyle='#111';ctx.fillText('BACK FACE ↓',14,by-7);
      paintPanel(ctx,faces[1],8,by,W-16,plan.backH);
    }
    return c;
  }
  paintPanel(ctx,faces[0],8,8,W-16,plan.panels[0]);
  if(kind==='normal') return c;
  const y2=8+plan.panels[0]+plan.gap;
  setFont(ctx,13,800);ctx.fillStyle='#111';
  const tag={split:'SECOND HALF / AFTERMATH',flip:'FLIP ↻',double:'BACK FACE ↓',adventure:'ADVENTURE SPELL ↓'}[kind]||'SECOND FACE';
  ctx.fillText(tag,14,y2-7);
  if(kind==='flip') paintPanel(ctx,faces[1]||faces[0],8,y2,W-16,plan.panels[1],{rotate180:true});
  else if(kind==='adventure') paintPanel(ctx,faces[1]||faces[0],24,y2,W-48,plan.panels[1]);
  else paintPanel(ctx,faces[1]||faces[0],8,y2,W-16,plan.panels[1]);
  return c;
}
function blobFromCanvas(c){ return new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('无法生成 PNG')),'image/png')); }
function pngFileName(){ return ((current.name || 'proxy').replace(/[^\w\-]+/g, '_') || 'proxy') + '_v12_large_type.png'; }
async function refreshPreview(){ const c=buildPrintCanvas(current); const blob=await blobFromCanvas(c); lastPreviewBlob=blob; if(lastPreviewUrl) URL.revokeObjectURL(lastPreviewUrl); lastPreviewUrl=URL.createObjectURL(blob); $("#proxyPreviewImg").src=lastPreviewUrl; }
async function render(card){ current=card; renderCardArt(card); await refreshPreview(); remember(card); renderRelatedTokens(card); }
function downloadBlob(blob,fileName){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=fileName; a.click(); setTimeout(()=>URL.revokeObjectURL(url),2000); }
async function ensurePreviewBlob(){ if(!lastPreviewBlob) await refreshPreview(); return lastPreviewBlob; }
async function proxyPng(){ try{ const blob=await ensurePreviewBlob(); downloadBlob(blob,pngFileName()); setStatus('已生成 PNG。','good'); }catch(e){ setStatus('PNG 生成失败：'+e.message,'bad'); } }
async function openPrintImage(){ try{ const blob=await ensurePreviewBlob(); const url=URL.createObjectURL(blob); window.open(url,'_blank'); setStatus('已打开打印图。可长按图片再分享。','good'); }catch(e){ setStatus('打开失败：'+e.message,'bad'); } }
async function sharePrintImage(){ try{ setStatus('正在生成打印图…'); const blob=await ensurePreviewBlob(); const fileName=pngFileName(); if(navigator.share && typeof File !== 'undefined'){ const file=new File([blob], fileName, {type:'image/png'}); const canShare=!navigator.canShare || navigator.canShare({files:[file]}); if(canShare){ setStatus('请选择 Express Thermal Print。','good'); await navigator.share({files:[file]}); return; } } setStatus('当前浏览器不支持直接分享，请改用“打开打印图”。','good'); }catch(e){ if(e?.name==='AbortError'){ setStatus('已取消分享。'); return; } setStatus('打印图生成失败：'+e.message,'bad'); } }
$('#randomBtn').onclick=randomCard; $('#randomTokenBtn').onclick=randomToken; $('#searchBtn').onclick=searchCard; $('#tokenSearchBtn').onclick=searchToken; $('#tokenQ').addEventListener('keydown',e=>{ if(e.key==='Enter') searchToken(); }); $('#cardQ').addEventListener('keydown',e=>{ if(e.key==='Enter') searchCard(); }); $('#printBtn').onclick=sharePrintImage; $('#pngBtn').onclick=proxyPng; $('#openImgBtn').onclick=openPrintImage; render(current); renderRecent();
</script>
